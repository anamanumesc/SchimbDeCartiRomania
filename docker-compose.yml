name: schimbdecartiromania
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  tunnel:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    profiles: [tunnel]
    restart: unless-stopped
    networks: [ingress]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    logging: *logging
    depends_on:
      nginx:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  quick-tunnel:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    profiles: [demo]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://nginx:80
    logging: *logging
    depends_on:
      nginx:
        condition: service_healthy
    networks: [ingress]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  nginx:
    image: ${PROXY_IMAGE:-bookexchange-proxy:local}
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    networks: [default, ingress]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]

  backend:
    image: ${BACKEND_IMAGE:-bookexchange-backend:local}
    build: ./backend
    restart: unless-stopped
    environment: &app-environment
      DATABASE_URL: postgresql://bookuser:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/bookexchange_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SSL: ${SMTP_SSL:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  mail-worker:
    image: ${BACKEND_IMAGE:-bookexchange-backend:local}
    profiles: [email]
    restart: unless-stopped
    command: [python, -m, app.mailer]
    environment: *app-environment
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  db:
    # Keep major 16: changing this against an existing volume is not an upgrade.
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bookexchange_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bookuser -d bookexchange_db']
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.9.1}
    profiles: [monitoring]
    restart: unless-stopped
    network_mode: host
    pid: host
    command: [--path.rootfs=/host, --web.listen-address=127.0.0.1:9100]
    volumes: ['/:/host:ro,rslave']
    logging: *logging
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  postgres_data:
    # Set to the existing volume name before migrating a running installation.
    name: ${POSTGRES_VOLUME_NAME:-bookexchange_postgres_data}

networks:
  ingress:
    ipam:
      config:
        - subnet: 172.30.42.0/29
