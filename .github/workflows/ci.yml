name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: bookuser
          POSTGRES_PASSWORD: bookpass
          POSTGRES_DB: bookexchange_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql://bookuser:bookpass@localhost:5432/bookexchange_db
        run: |
          pytest -v backend/tests/test_api.py

  build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Compose Build
        run: |
          docker compose build

  deploy:
    name: Deploy to Raspberry Pi
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pull Latest Code
        run: |
          git pull origin main

      - name: Build and Start Containers
        run: |
          docker compose up -d --build

      - name: Resilient Healthcheck Loop
        run: |
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Healthcheck passed (HTTP 200 OK) on attempt $i."
              exit 0
            fi
            echo "Attempt $i: Endpoint returned HTTP$STATUS. Retrying in 3s..."
            sleep 3
          done
          echo "Deployment failed healthcheck loop."
          docker compose ps
          docker logs bookexchange_backend --tail 50
          exit 1

      - name: Prune Dangling Docker Images
        if: always()
        run: |
          echo "Cleaning up dangling images..."
          docker image prune -f

      - name: Notify Deployment Status to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL is not set, skipping notification."
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          COMMIT_SHA=$(git rev-parse --short HEAD)

          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            STATUS_TEXT="✅ Deployment Successful"
          else
            COLOR=15158332
            STATUS_TEXT="❌ Deployment Failed"
          fi

          PAYLOAD=$(cat <<JSON_EOF
          {
            "embeds": [
              {
                "title": "${STATUS_TEXT}",
                "description": "**Repo:** \`${{ github.repository }}\`\\n**Branch:** \`${{ github.ref_name }}\`\\n**Commit:** \`${COMMIT_SHA}\` - ${COMMIT_MSG}\\n**Author:** ${COMMIT_AUTHOR}\\n**Host:** Raspberry Pi 4 (Production)",
                "color": ${COLOR},
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ]
          }
JSON_EOF
          )

          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"
