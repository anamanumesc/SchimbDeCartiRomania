name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Lint & Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: bookuser
          POSTGRES_PASSWORD: bookpass
          POSTGRES_DB: bookexchange_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql://bookuser:bookpass@localhost:5432/bookexchange_db
        run: |
          cd backend
          PYTHONPATH=. pytest -v

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: bookexchange-backend:test

  deploy:
    name: Deploy to Raspberry Pi
    runs-on: self-hosted
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy & Restart Containers
        run: |
          cd ~/SchimbDeCartiRomania
          git pull origin main
          docker compose up -d --build
          echo "Waiting for service to become healthy..."
          for i in {1..12}; do
            if curl -sf http://localhost/health > /dev/null; then
              echo "Healthcheck passed!"
              exit 0
            fi
            echo "Attempt $i/12 failed, waiting 3s..."
            sleep 3
          done
          echo "Deployment failed healthcheck after 36 seconds."
          exit 1
