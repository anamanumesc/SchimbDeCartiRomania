name: CI and release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookuser
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bookexchange_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bookuser -d bookexchange_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bookuser:ci-only-password@localhost:5432/bookexchange_test
      JWT_SECRET_KEY: ci-only-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pytest -v backend/tests
      - name: Check scripts and Compose
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          docker compose config --quiet
          python -m compileall -q backend/app scripts/notify_deploy.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check frontend syntax and escaped rendering
        run: |
          node --check frontend/app.js
          node frontend/tests/security.test.cjs
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off
      - name: Validate Nginx image
        run: |
          docker build -f nginx/Dockerfile -t proxy-test .
          docker network create proxy-test
          docker run -d --name backend --network proxy-test nginx:stable-alpine
          docker run --rm --network proxy-test proxy-test nginx -t

  recovery:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age rclone
      - name: Rehearse encrypted recovery with disposable data
        run: |
          docker build -t bookexchange-backend:validation backend
          docker build -f nginx/Dockerfile -t bookexchange-proxy:validation .
          TEST_PROXY_IMAGE=bookexchange-proxy:validation bash scripts/test_recovery.sh

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, recovery]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, proxy]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image repository
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "repository=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component == 'backend' && './backend' || '.' }}
          file: ${{ matrix.component == 'backend' && './backend/Dockerfile' || './nginx/Dockerfile' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.repository }}/${{ matrix.component }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    # Only trusted main pushes reach the Pi; PR jobs use hosted runners.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PI_DEPLOY != 'false'
    needs: [test, build]
    runs-on: [self-hosted, Linux, ARM64]
    permissions:
      contents: read
      packages: read
    environment: production
    concurrency:
      group: bookexchange-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy tested release
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          COMPOSE_ENV_FILE: /etc/bookexchange/app.env
        run: |
          export BACKEND_IMAGE="ghcr.io/${REPOSITORY,,}/backend:$RELEASE_SHA"
          export PROXY_IMAGE="ghcr.io/${REPOSITORY,,}/proxy:$RELEASE_SHA"
          bash scripts/deploy.sh
      - name: Notify deployment result
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOY_STATUS: ${{ job.status }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_AUTHOR: ${{ github.event.head_commit.author.name }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_deploy.py
