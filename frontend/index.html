<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schimb de Cărți România</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">📚 Schimb de Cărți</div>
      <div id="connection-badge" class="badge checking">
        <span class="dot"></span>
        <span id="connection-text">Verificare conexiune...</span>
      </div>
    </header>

    <main class="card">
      <h1>Catalog Comunitar de Cărți</h1>
      <p class="subtitle">Schimbă cărți citite cu alte titluri oferite de pasionați din comunitate.</p>

      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-num" id="books-count">0</span>
          <span class="stat-label">Cărți Găsite</span>
        </div>
        <div class="stat-box">
          <span class="stat-num" id="api-version">-</span>
          <span class="stat-label">Versiune API</span>
        </div>
      </div>

      <!-- Formular adăugare carte -->
      <section class="form-section">
        <h2>Adaugă o carte pentru schimb</h2>
        <form id="book-form">
          <div class="form-row">
            <div class="form-group">
              <label for="title">Titlu carte *</label>
              <input type="text" id="title" required placeholder="ex. Dune">
            </div>
            <div class="form-group">
              <label for="author">Autor *</label>
              <input type="text" id="author" required placeholder="ex. Frank Herbert">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="genre">Gen literar</label>
              <input type="text" id="genre" placeholder="ex. SF / Ficțiune">
            </div>
            <div class="form-group">
              <label for="condition">Stare carte</label>
              <select id="condition">
                <option value="Nouă">Nouă / Impecabilă</option>
                <option value="Bună" selected>Bună (ușoare urme de citire)</option>
                <option value="Uzată">Uzată / Acceptabilă</option>
              </select>
            </div>
            <div class="form-group">
              <label for="city">Oraș</label>
              <input type="text" id="city" placeholder="ex. Iași">
            </div>
          </div>
          <button type="submit" class="btn btn-primary" id="submit-btn">Adaugă în catalog</button>
        </form>
      </section>

      <!-- Bara de filtrare & căutare -->
      <section class="catalog-section">
        <div class="catalog-header">
          <h2>Cărți disponibile</h2>
          <button type="button" class="btn btn-text" id="clear-filters-btn">Resetează filtre</button>
        </div>

        <div class="filters-bar">
          <div class="filter-input-wrap">
            <input type="text" id="search-input" placeholder="🔍 Caută după titlu sau autor...">
          </div>
          <div class="filter-dropdowns">
            <input type="text" id="filter-genre" placeholder="Filtru gen...">
            <input type="text" id="filter-city" placeholder="Filtru oraș...">
          </div>
        </div>

        <div id="books-list" class="books-grid">
          <p class="empty-text">Se încarcă catalogul...</p>
        </div>
      </section>

      <div class="actions">
        <a href="/docs" target="_blank" class="btn btn-secondary">Documentație API (Swagger)</a>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
