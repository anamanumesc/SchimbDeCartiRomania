worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    # Only cloudflared and nginx join this dedicated Compose network.
    set_real_ip_from 172.30.42.0/29;
    real_ip_header CF-Connecting-IP;
    upstream backend_upstream { server backend:8000; }
    server {
        listen 80;
        server_name _;
        client_max_body_size 5M;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        location / { try_files $uri $uri/ /index.html; }
        location ~ ^/api/auth/(login|register|resend-verification|verify-email)$ {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params_bookexchange.conf;
        }
        location ~ ^/(api(?:/|$)|health$|docs(?:/|$)|openapi\.json$) {
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params_bookexchange.conf;
        }
    }
}
